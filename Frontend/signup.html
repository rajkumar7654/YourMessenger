<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="stylesheet" href="/Frontend/css/signup.css">
</head>
<body>
  <div class="box">
    <h2>Sign Up</h2>

    <form id="signupForm">
      <label>Name</label>
      <input type="text" id="name" placeholder="Enter your name">

      <label>Email</label>
      <input type="email" id="email" placeholder="Enter your email">

      <label>Phone Number</label>
      <input type="text" id="phone" placeholder="Enter 10 digit phone number">

      <label>Password</label>
      <input type="password" id="password" placeholder="Enter password">

      <p id="message"></p>

      <button type="submit">Sign Up</button>
    </form>

    <p class="link">Already have an account? <a href="index.html">Login</a></p>
  </div>

  <script src="/Frontend/js/signup.js"></script>
</body>
</html>
